[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "explicit-tpms"
version = "0.1.0"
description = "PyQt/CadQuery desktop tool for generating explicit TPMS lattice structures."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "cadquery>=2.4",
    "PyQt5>=5.15",
    "numpy>=1.23",
    "scipy>=1.9",
    "geomdl>=5.3",
]

[project.scripts]
explicit-tpms = "main_ui:main"

[tool.setuptools]
py-modules = ["main_ui"]
packages = ["Lattice_lib", "Nurbs_Base", "ui"]

[tool.setuptools.package-data]
Lattice_lib = ["precomputation/*.mat"]
